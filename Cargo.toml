[package]
name = "prismapsis"
default-run = "prismapsis"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A gravity-bouncing, colour-collecting shooter built with Bevy"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Developer tools (live tuning panel). Off in release builds.
dev = ["dep:bevy_egui"]

[dependencies]
# A 2D game: the 3D renderer and Ogg support are left out, which also keeps
# the web build small. `wav` decodes the generated sound effects and music.
bevy = { version = "0.20.1", default-features = false, features = [
    "2d",
    "ui",
    "bevy_audio",
    "wav",
] }
bevy_egui = { version = "0.43.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
# `noise` and `png` paint and write the generated art (`just art`).
noise = "0.9.0"
png = "0.18.1"

# The browser has no `std::time` clock, and keeps settings in its local
# storage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"
web-sys = { version = "0.3.107", features = ["Window", "Storage"] }

[build-dependencies]
toml = "1.1.8"

[workspace]
members = ["tools/sfx"]

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
# Bevy systems take resources/queries by value and often have complex query types.
needless_pass_by_value = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
module_name_repetitions = "allow"
# mul_add obscures game maths and is not faster on every target.
suboptimal_flops = "allow"

# Optimise dependencies even in dev builds; Bevy is unusably slow otherwise.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# Drop symbols and debug info from shipped binaries.
strip = true

# The web build: optimised for size, as the whole game is downloaded before
# it starts.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
