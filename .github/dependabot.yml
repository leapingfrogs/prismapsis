version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      bevy:
        patterns: ["bevy*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    ignore:
      # Refs of this action select a Rust toolchain, not an action version.
      - dependency-name: dtolnay/rust-toolchain
