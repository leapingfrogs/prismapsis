name: Conventions

# PRs are squash-merged with the PR title as the commit message, so the title
# must be a Conventional Commit for release-please to pick it up. Individual
# commits are linted too, keeping history readable while a PR is open.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Default range lints every commit the PR adds (uses committed.toml).
      - uses: crate-ci/committed@v1.1.11
