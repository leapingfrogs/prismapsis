name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run catches newly published advisories and outdated deps.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  coverage:
    name: Test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --locked --no-report
      - name: Check threshold and write lcov
        run: cargo llvm-cov report --ignore-filename-regex src/main.rs --fail-under-lines 80 --lcov --output-path lcov.info
      - name: Write HTML report
        if: always()
        run: cargo llvm-cov report --ignore-filename-regex src/main.rs --html
      - name: Add summary to job summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --ignore-filename-regex src/main.rs --summary-only | sed "s|$GITHUB_WORKSPACE/||"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            lcov.info
            target/llvm-cov/html
      - uses: actions/upload-pages-artifact@v5
        if: vars.PUBLISH_COVERAGE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: target/llvm-cov/html

  # Opt-in: enable GitHub Pages (source: GitHub Actions) and set the repo
  # variable PUBLISH_COVERAGE=true to publish the HTML report from main.
  pages:
    name: Publish coverage report
    if: vars.PUBLISH_COVERAGE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  deny:
    name: Security & licences (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --locked

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  outdated:
    name: Outdated dependencies
    runs-on: ubuntu-latest
    # Informational: new upstream releases shouldn't block PRs. Dependabot opens update PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-outdated
      - run: cargo outdated --root-deps-only --exit-code 1

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      # MSRV comes from Cargo.toml so there is a single source of truth.
      - name: Read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
